version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelmate-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/travelmate
      - JWT_SECRET=travelmate_production_super_secret_jwt_key_2024
      - CLIENT_URL=http://localhost:5000
      # SMTP Configuration for Nodemailer:
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=your_email@gmail.com
      # - SMTP_PASS=your_app_password
      # - EMAIL_FROM="TravelMate" <your_email@gmail.com>
    depends_on:
      - mongo

  mongo:
    image: mongo:7-jammy
    container_name: travelmate-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
